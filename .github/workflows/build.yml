name: Build Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build APK (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Las librerías BASS están versionadas en app/src/main/jniLibs.
      # Se comprueba que estén todas antes de compilar para fallar rápido.
      - name: Verificar librerías BASS
        run: |
          set -e
          missing=0
          for ABI in arm64-v8a armeabi-v7a; do
            for LIB in libbass.so libbassmix.so libbass_fx.so libbass_aac.so libbassopus.so libbassflac.so libbassalac.so libbassape.so libbasswv.so libbassdsd.so; do
              if [ ! -f "app/src/main/jniLibs/$ABI/$LIB" ]; then
                echo "FALTA: app/src/main/jniLibs/$ABI/$LIB"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: faltan librerías BASS en el repositorio"
            exit 1
          fi
          echo "Librerías BASS completas"

      - name: Dar permisos de ejecución al Gradle Wrapper
        run: chmod +x gradlew

      - name: Reconstruir el keystore desde el Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/twedmusic-release-key.jks

      - name: Generar keystore.properties desde los Secrets
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=keystore/twedmusic-release-key.jks"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > app/keystore.properties

      - name: Compilar APK de Release firmado
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
        run: ./gradlew assembleRelease --stacktrace

      - name: Subir informes de Lint como Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 30

      - name: Eliminar el keystore temporal
        if: always()
        run: rm -rf app/keystore app/keystore.properties

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwedMusic-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30